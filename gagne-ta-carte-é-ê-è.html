<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Gagne ta carte ! — é ê è</title>
<style>
  :root{
    --ardoise: #14279b;
    --ardoise-dark: #0d1c6e;
    --craie: #f4efe1;
    --or: #e8b13c;
    --bon: #6fbf8b;
    --mauvais: #d96a4e;
    --carte-bord: #d8cfb4;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(ellipse at top, rgba(255,255,255,0.05), transparent 60%),
      var(--ardoise);
    color:var(--craie);
    font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: clamp(14px, 4vw, 40px);
  }
  header{
    width:100%;
    max-width: 560px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom: 18px;
  }
  h1{
    font-size: clamp(1.3rem, 4vw, 1.7rem);
    margin:0;
    letter-spacing: 0.5px;
  }
  h1 .accent{ color: var(--or); }
  #compteur{
    font-size: 0.95rem;
    opacity: 0.85;
    white-space: nowrap;
  }

  .scene{
    width:100%;
    max-width: 560px;
    perspective: 1400px;
    -webkit-perspective: 1400px;
  }

  .carte{
    position:relative;
    width:100%;
    min-height: 320px;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(.4,.2,.2,1);
  }
  .carte.retournee{ transform: rotateY(180deg); -webkit-transform: rotateY(180deg); }

  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius: 22px;
    border: 3px solid var(--carte-bord);
    background: var(--craie);
    color: #29281f;
    padding: clamp(20px, 5vw, 34px);
    display:flex;
    flex-direction:column;
    box-shadow: 0 14px 30px rgba(0,0,0,0.35);
  }
  .face.dos{ transform: rotateY(180deg); -webkit-transform: rotateY(180deg); }

  .etiquette{
    align-self:flex-start;
    font-size: 0.72rem;
    font-weight:bold;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--ardoise);
    color: var(--craie);
    margin-bottom: 14px;
  }

  .clue{
    font-size: clamp(1.05rem, 3.6vw, 1.3rem);
    line-height:1.45;
  }

  .zone-reponse{ margin-top: 18px; }

  .image-carte{
    display:block;
    width: 100%;
    height: 150px;
    margin: 0 auto 14px;
    border-radius: 12px;
    object-fit: contain;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .image-manquante{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 4px;
    width: 100%;
    height: 150px;
    margin: 0 auto 14px;
    border: 2px dashed #c9c2ab;
    border-radius: 12px;
    color: #8a8262;
    font-size: 0.85rem;
    text-align:center;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .image-manquante code{ font-size: 0.8rem; }

  /* Filet de sécurité renforcé : sur certains navigateurs mobiles,
     backface-visibility n'est pas fiable pour les faces contenant une
     image (couche de composition indépendante). On masque en dur,
     y compris hors-écran, la face qui ne doit pas être visible. */
  .carte:not(.retournee) .face.dos{
    visibility: hidden !important;
    opacity: 0;
    pointer-events: none;
  }
  .carte.retournee .face.recto{
    visibility: hidden !important;
    opacity: 0;
    pointer-events: none;
  }

  input[type="text"]{
    width:100%;
    font-size: 1.1rem;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid #c9c2ab;
    font-family: inherit;
  }
  input[type="text"]:focus{
    outline: 3px solid var(--or);
    outline-offset: 1px;
  }

  .options{ display:flex; flex-wrap:wrap; gap:10px; margin-top: 6px; }

  button{
    font-family: inherit;
    font-size: 1rem;
    border: none;
    border-radius: 12px;
    padding: 12px 18px;
    cursor:pointer;
    font-weight:bold;
  }
  .btn-option{
    background: #eee6cf;
    color:#29281f;
    flex:1;
    min-width: 110px;
  }
  .btn-option:hover, .btn-option:focus-visible{ background: var(--or); }

  .btn-principal{
    background: var(--or);
    color:#29281f;
    margin-top:14px;
    width:100%;
  }
  .btn-principal:hover, .btn-principal:focus-visible{ filter: brightness(1.08); }

  .verdict{
    display:flex;
    align-items:center;
    gap:10px;
    font-size: 1.15rem;
    font-weight:bold;
    margin-bottom: 10px;
  }
  .verdict.ok{ color: #206a3f; }
  .verdict.non{ color: #a83a20; }
  .verdict.reprise{ color: #93690f; }
  .pastille{
    width: 30px; height:30px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:white; font-size:1rem; flex-shrink:0;
  }
  .pastille.ok{ background: var(--bon); }
  .pastille.non{ background: var(--mauvais); }
  .pastille.reprise{ background: var(--or); }

  .reponse-correcte{
    font-size: clamp(1.4rem, 5vw, 1.9rem);
    font-weight:bold;
    margin: 4px 0 14px;
  }

  .astuce{ font-size:0.9rem; opacity:0.75; margin-top:auto; }
  .rappel-question{
    font-size: 0.95rem;
    opacity: 0.8;
    font-style: italic;
    margin: 0 0 10px;
    line-height: 1.4;
  }
  .mot-cible{
    font-size: 0.95rem;
    opacity: 0.75;
    margin: 4px 0 0;
  }
  .mot-cible strong{ color: var(--ardoise); }

  #ecran-fin{
    display:none;
    width:100%;
    max-width:560px;
    background: var(--craie);
    color:#29281f;
    border-radius: 22px;
    border: 3px solid var(--carte-bord);
    padding: clamp(22px, 5vw, 36px);
    text-align:center;
    box-shadow: 0 14px 30px rgba(0,0,0,0.35);
  }
  #ecran-fin h2{ margin-top:0; }
  #score-final{ font-size: 2.2rem; font-weight:bold; color:#206a3f; margin: 6px 0 6px; }
  #echelle-verbale{ font-size: 1.05rem; margin: 0 0 18px; }
  #liste-a-revoir{ text-align:left; margin: 0 0 18px; padding-left: 20px; }
  #liste-a-revoir li{ margin-bottom:4px; }

  .visually-hidden{
    position:absolute; width:1px; height:1px; overflow:hidden;
    clip: rect(0 0 0 0); white-space:nowrap;
  }

  .consigne-ecriture{
    width:100%;
    max-width: 560px;
    background: rgba(232,177,60,0.12);
    border: 1px solid rgba(232,177,60,0.4);
    color: var(--craie);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 0.9rem;
    text-align:center;
    margin-bottom: 16px;
  }

  @media (prefers-reduced-motion: reduce){
    .carte{ transition:none; }
  }
</style>
</head>
<body>

<header>
  <h1>Gagne ta carte <span class="accent">! é ê è</span></h1>
  <div id="compteur">Carte 1 / 25</div>
</header>

<p class="consigne-ecriture">✏️ Écris d'abord le mot demandé sur ton cahier de brouillon, avant de le taper ou de le choisir ici.</p>

<div class="scene">
  <div class="carte" id="carte">
    <div class="face recto" id="face-recto">
      <span class="etiquette" id="etiquette-type">Devine le mot</span>
      <div class="clue" id="texte-clue">Chargement…</div>
      <div class="zone-reponse" id="zone-reponse"></div>
    </div>
    <div class="face dos" id="face-dos">
      <div class="verdict" id="verdict-bloc">
        <span class="pastille" id="pastille"></span>
        <span id="verdict-texte"></span>
      </div>
      <p class="rappel-question" id="rappel-question"></p>
      <div class="reponse-correcte" id="reponse-correcte"></div>
      <p class="mot-cible" id="mot-cible"></p>
      <button class="btn-principal" id="btn-suivant">Carte suivante</button>
    </div>
  </div>
</div>

<div id="ecran-fin">
  <h2>Partie terminée !</h2>
  <p>Tu as gagné</p>
  <div id="score-final">0 / 25</div>
  <p id="echelle-verbale"></p>
  <div id="bloc-revoir">
    <p>Mots à revoir la prochaine fois :</p>
    <ul id="liste-a-revoir"></ul>
  </div>
  <button class="btn-principal" id="btn-rejouer">Rejouer</button>
</div>

<p aria-live="polite" class="visually-hidden" id="annonce"></p>

    "reponse": "mère",
    "mot": "mère"
  },
  {
    "type": "libre",
    "clue": "Je m'entends comme deux chaussettes pareilles. Mais avec mon è, c'est moi le papa ! Qui suis-je ?",
    "reponse": "père",
    "mot": "père"
  },
  {
    "type": "libre",
    "clue": "Je désigne un animal. Mon accent circonflexe remplace la lettre s, que l'on retrouve dans le mot bestial. Qui suis-je ?",
    "reponse": "bête",
    "mot": "bête"
  },
  {
    "type": "libre",
    "clue": "On m'organise pour un anniversaire. Mon accent circonflexe remplace la lettre s, que l'on retrouve dans le mot festival. Qui suis-je ?",
    "reponse": "fête",
    "mot": "fête"
  },
  {
    "type": "libre",
    "clue": "Je suis un mot invariable avec \"ê\". Je veux dire pareil, identique.",
    "reponse": "même",
    "mot": "même"
  },
  {
    "type": "libre",
    "clue": "Je suis posée sur le cou. Mon e porte un chapeau (accent circonflexe), tout comme moi quand il fait froid ! Qui suis-je ?",
    "reponse": "tête",
    "mot": "tête"
  },
  {
    "type": "libre",
    "clue": "Dans mon nom, j'ai deux lettres pareilles : deux e. Mais l'un des deux porte un chapeau ! Je sers à dire que deux choses sont identiques. Qui suis-je ?",
    "reponse": "même",
    "mot": "même"
  }
];

const ETIQUETTES = { libre: "Devine le mot", choix: "Choisis la bonne graphie", vrai_faux: "Vrai ou faux ?", image: "Écris le mot" };

let file = [];
let carteCourante = null;
let resolues = 0;
let score = 0;
let motsARevoir = [];
let dejaRepondu = false;

const MAX_TENTATIVES = 2; // 1 essai + 1 reprise, comme la carte remise sous le tas

const ECHELLE_VERBALE = [
  { seuil: 100, message: "Score parfait ! Tu maîtrises tous ces mots." },
  { seuil: 90, message: "Excellent ! Presque tous les mots sont acquis." },
  { seuil: 75, message: "Bien joué ! Quelques mots restent à consolider." },
  { seuil: 50, message: "Pas mal, entraîne-toi encore sur les mots ci-dessous." },
  { seuil: 0, message: "Bon début : on retravaille ensemble ces mots la prochaine fois." },
];

function messageEchelle(pourcentage){
  return ECHELLE_VERBALE.find(e => pourcentage >= e.seuil).message;
}

const carteEl = document.getElementById("carte");
const compteurEl = document.getElementById("compteur");
const etiquetteEl = document.getElementById("etiquette-type");
const clueEl = document.getElementById("texte-clue");
const zoneReponseEl = document.getElementById("zone-reponse");
const verdictBlocEl = document.getElementById("verdict-bloc");
const pastilleEl = document.getElementById("pastille");
const verdictTexteEl = document.getElementById("verdict-texte");
const reponseCorrecteEl = document.getElementById("reponse-correcte");
const rappelQuestionEl = document.getElementById("rappel-question");
const motCibleEl = document.getElementById("mot-cible");
const ecranFinEl = document.getElementById("ecran-fin");
const sceneEl = document.querySelector(".scene");
const annonceEl = document.getElementById("annonce");

function normalise(txt){
  return txt
    .toString()
    .trim()
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function melanger(tableau){
  const copie = tableau.slice();
  for (let i = copie.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [copie[i], copie[j]] = [copie[j], copie[i]];
  }
  return copie;
}

function demarrer(){
  file = melanger(CARTES.map((_, i) => i)).map(idx => ({ idx, tentatives: 0 }));
  resolues = 0;
  score = 0;
  motsARevoir = [];
  ecranFinEl.style.display = "none";
  sceneEl.style.display = "";
  piocherSuivante();
}

function piocherSuivante(){
  if (file.length === 0){
    finDePartie();
    return;
  }
  carteCourante = file.shift();
  afficherCarte();
}

function afficherCarte(){
  dejaRepondu = false;
  carteEl.classList.remove("retournee");
  const carte = CARTES[carteCourante.idx];
  compteurEl.textContent = `Carte ${resolues + 1} / ${CARTES.length}`;
  etiquetteEl.textContent = ETIQUETTES[carte.type];
  clueEl.textContent = carte.clue;
  zoneReponseEl.innerHTML = "";

  if (carte.type === "image"){
    const img = document.createElement("img");
    img.className = "image-carte";
    img.src = carte.image.startsWith("data:") ? carte.image : `images/${carte.image}`;
    img.alt = "Devine le mot";
    img.onerror = function(){
      const espace = document.createElement("div");
      espace.className = "image-manquante";
      espace.innerHTML = `🖼️<br>image manquante :<br><code>${carte.image}</code>`;
      this.replaceWith(espace);
    };
    zoneReponseEl.appendChild(img);
  }

  if (carte.type === "libre" || carte.type === "image"){
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "Écris ta réponse…";
    input.autocomplete = "off";
    input.id = "champ-libre";
    const btn = document.createElement("button");
    btn.className = "btn-principal";
    btn.textContent = "Valider";
    btn.addEventListener("click", () => valider(input.value));
    input.addEventListener("keydown", e => { if (e.key === "Enter") valider(input.value); });
    zoneReponseEl.appendChild(input);
    zoneReponseEl.appendChild(btn);
    setTimeout(() => input.focus(), 350);
  } else {
    const wrap = document.createElement("div");
    wrap.className = "options";
    const options = carte.type === "vrai_faux" ? ["vrai", "faux"] : carte.options;
    options.forEach(opt => {
      // une option peut être une simple chaîne (label = valeur validée) ou
      // un objet {label, valeur} quand l'intitulé du bouton doit rester
      // discret sans révéler l'orthographe exacte de la réponse.
      const estObjet = typeof opt === "object" && opt !== null;
      const label = estObjet ? opt.label : opt;
      const valeur = estObjet ? opt.valeur : opt;
      const b = document.createElement("button");
      b.className = "btn-option";
      b.textContent = label.charAt(0).toUpperCase() + label.slice(1);
      b.addEventListener("click", () => valider(valeur));
      wrap.appendChild(b);
    });
    zoneReponseEl.appendChild(wrap);
  }
}

function valider(reponseDonnee){
  if (dejaRepondu) return;
  dejaRepondu = true;
  const carte = CARTES[carteCourante.idx];
  const correct = normalise(reponseDonnee) === normalise(carte.reponse);
  carteCourante.tentatives++;

  if (correct){
    score++;
    resolues++;
    verdictBlocEl.className = "verdict ok";
    pastilleEl.className = "pastille ok";
    pastilleEl.textContent = "✓";
    verdictTexteEl.textContent = "Bravo, c'est juste !";
  } else if (carteCourante.tentatives < MAX_TENTATIVES){
    // comme la carte ratée remise sous le tas : on la repropose plus tard
    // dans la même partie, sans encore la compter comme terminée.
    const decalage = Math.min(file.length, 2 + Math.floor(Math.random() * 3));
    file.splice(decalage, 0, carteCourante);
    verdictBlocEl.className = "verdict reprise";
    pastilleEl.className = "pastille reprise";
    pastilleEl.textContent = "↻";
    verdictTexteEl.textContent = "Pas tout à fait. On la reverra un peu plus tard.";
  } else {
    resolues++;
    motsARevoir.push(carte.mot || carte.reponse);
    verdictBlocEl.className = "verdict non";
    pastilleEl.className = "pastille non";
    pastilleEl.textContent = "✗";
    verdictTexteEl.textContent = "Pas grave, ce mot reviendra une prochaine fois.";
  }
  rappelQuestionEl.textContent = carte.clue;
  reponseCorrecteEl.textContent = carte.reponse;
  if (carte.mot && normalise(carte.mot) !== normalise(carte.reponse)) {
    motCibleEl.innerHTML = `Mot cible : <strong>${carte.mot}</strong>`;
    motCibleEl.style.display = "block";
  } else {
    motCibleEl.textContent = "";
    motCibleEl.style.display = "none";
  }
  annonceEl.textContent = correct ? "Bonne réponse" : "Réponse incorrecte, la bonne réponse s'affiche";

  carteEl.classList.add("retournee");
}

document.getElementById("btn-suivant").addEventListener("click", piocherSuivante);

function finDePartie(){
  sceneEl.style.display = "none";
  ecranFinEl.style.display = "block";
  document.getElementById("score-final").textContent = `${score} / ${CARTES.length}`;
  const pourcentage = Math.round((score / CARTES.length) * 100);
  document.getElementById("echelle-verbale").textContent = messageEchelle(pourcentage);
  const liste = document.getElementById("liste-a-revoir");
  const blocRevoir = document.getElementById("bloc-revoir");
  liste.innerHTML = "";
  if (motsARevoir.length === 0){
    blocRevoir.style.display = "none";
  } else {
    blocRevoir.style.display = "block";
    [...new Set(motsARevoir)].forEach(mot => {
      const li = document.createElement("li");
      li.textContent = mot;
      liste.appendChild(li);
    });
  }
}

document.getElementById("btn-rejouer").addEventListener("click", demarrer);

demarrer();
</script>
</body>
</html>
